<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{main/layout :: head}"></head>

<body>
<header th:replace="~{main/layout :: header}"></header>

<section th:fragment="content">
	<div class="container-fluid" id="pantll">
		<div class="container">
			<div class="row">
				<h1 class="text-info" th:text="${titlepage}"></h1>

				<nav aria-label="breadcrumb" class="my-3">
					<ol class="breadcrumb custom-breadcrumb p-3 shadow-sm">
						<li class="breadcrumb-item">
							<a th:href="@{/index}" class="ajax-link d-inline-flex align-items-center">
								<ion-icon name="home-outline" class="me-2"></ion-icon>
								Inicio
							</a>
						</li>
						<li class="breadcrumb-item" th:if="${modulo != null}">
							<span th:text="${modulo}"></span>
						</li>
						<li class="breadcrumb-item active" aria-current="page">
							<strong th:text="${titlepage}"></strong>
						</li>
					</ol>
				</nav>

				<table class="table table-bordered table-hover table-striped">
					<thead class="table-dark text-center">
					<tr>
						<th class="col-2">Nombre Completo</th>
						<th class="col-sm-2">Doc. Identidad</th>
						<th class="col-sm-1">Edad</th>
						<th class="col-sm-1">Nacimiento</th>
						<th class="col-sm-2">Correo Electronico</th>
						<th sec:authorize="hasRole('ROLE_ADMIN')">
							<ion-icon name="ellipsis-vertical-outline"></ion-icon>
						</th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="item: ${employee}">
						<td th:text="${item.fullName}"></td>
						<td class="text-center" th:text="${item.identityPeople}"></td>
						<td class="text-center" th:text="${item.agePeople}"></td>
						<td th:text="${item.happyDay}"></td>
						<td th:text="${item.emailPeople}"></td>
						<td class="text-center" sec:authorize="hasRole('ROLE_ADMIN')">
							<a th:href="@{/peoples/verdata/} + ${item.id}" class="btn btn-outline-info col-xs-4 tooltip-custom" title="Ver datos">
								<ion-icon name="eye-outline" style="font-size: 20px;"></ion-icon>
							</a>
							<a th:if="${item.schedule.isEmpty()}" th:href="@{/schedule/schuduleweek/}+ ${item.id}" class="btn bg-warning col-xs-4 tooltip-custom" title="Crear turno">
								<ion-icon name="calendar-outline" style="font-size: 20px;"></ion-icon>
							</a>
							<a th:if="${!item.schedule.isEmpty()}" th:href="@{/peoples/verschedule/} + ${item.id}" class="btn btn-success col-xs-4 tooltip-custom" title="Ver horario">
								<ion-icon name="calendar-outline" style="font-size: 20px;"></ion-icon>
							</a>
							<a th:onclick="QuestionEditPeople([[${item.id}]])" class="btn btn-outline-primary col-xs-4" title="Editar">
								<ion-icon name="create-outline" style="font-size: 20px;"></ion-icon>
							</a>
							<a th:onclick="QuestionDeleteByIdPerson([[${item.id}]])" class="btn btn-outline-danger col-xs-4" title="Eliminar">
								<ion-icon name="trash-outline" style="font-size: 20px;"></ion-icon>
							</a>
						</td>
					</tr>
					</tbody>
				</table>
				<nav th:replace="~{paginator-nav :: paginator}"></nav>
			</div>
		</div>
	</div>
</section>
<footer th:replace="~{main/layout :: footer}"></footer>
</body>
</html>
